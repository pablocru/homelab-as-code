# Connection details live in the control node's ~/.ssh/config; the inventory
# names hosts by SSH alias only (see docs/control-node.md).
[defaults]
inventory = inventories/production/hosts.yml
# Keep downloaded collections inside the repository so runs are reproducible.
collections_path = ./collections
# Discovery can pick a different interpreter once another Python appears on the
# node, so the distro default is pinned to keep module execution reproducible.
interpreter_python = /usr/bin/python3
