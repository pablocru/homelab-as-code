[project]
name = "homelab-as-code"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "ansible-core==2.22.0",
  "ansible-lint==26.11.0",
  "yamllint==1.38.0",
]

[tool.uv]
# This repository is not a Python package: uv only installs the dependencies
# into the project environment.
package = false
# mise installs the interpreter that .python-version names; uv never downloads
# or manages one of its own.
python-downloads = "manual"
python-preference = "only-system"
